name: Liquidar apuestas

# Cierra resultados y liquida apuestas cada 10 minutos.
# Necesario porque el cron de Vercel (plan Hobby) solo corre una vez al día.
#
# Antes corría cada 2 horas porque cada revisión gastaba créditos de The Odds
# API. Desde la liquidación propia los resultados salen de fuentes gratuitas y
# sin tope (statsapi.mlb.com y la API pública de ESPN), así que revisar seguido
# no cuesta nada y la ganancia se acredita a los pocos minutos de terminar el
# partido, que es lo que se quería. GitHub Actions es gratis e ilimitado acá
# porque el repositorio es público.
#
# El cron de GitHub no es puntual: en horas pico puede demorarse. No importa,
# porque la corrida es idempotente (un evento ya cerrado no se vuelve a liquidar).

on:
  schedule:
    - cron: "*/10 * * * *" # cada 10 minutos
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

# Evita que dos corridas se pisen si una tarda
concurrency:
  group: liquidar
  cancel-in-progress: false

jobs:
  liquidar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/resultados
        env:
          PALPITO_URL: ${{ vars.PALPITO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PALPITO_URL" ]; then
            echo "PALPITO_URL aún no está configurada (falta el deploy). Nada que hacer."
            exit 0
          fi
          code=$(curl -sS -o respuesta.json -w "%{http_code}" \
            "${PALPITO_URL%/}/api/resultados" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP $code"
          cat respuesta.json || true
          echo
          test "$code" = "200"
