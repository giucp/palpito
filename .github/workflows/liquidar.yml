name: Liquidar apuestas

# Cierra resultados y liquida apuestas cada 2 horas.
# Necesario porque el cron de Vercel (plan Hobby) solo corre una vez al día.
#
# Cada corrida con partidos pendientes gasta 1 crédito de The Odds API por liga,
# y el plan gratis da 500 al mes (~16 por día). A cada 30 min se agotaban en
# pocos días; para apuestas pre-partido no hace falta liquidar al minuto.
# Cuando no hay nada que cerrar, la corrida no gasta créditos.

on:
  schedule:
    - cron: "0 */2 * * *" # cada 2 horas
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

# Evita que dos corridas se pisen si una tarda
concurrency:
  group: liquidar
  cancel-in-progress: false

jobs:
  liquidar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/resultados
        env:
          PALPITO_URL: ${{ vars.PALPITO_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PALPITO_URL" ]; then
            echo "PALPITO_URL aún no está configurada (falta el deploy). Nada que hacer."
            exit 0
          fi
          code=$(curl -sS -o respuesta.json -w "%{http_code}" \
            "${PALPITO_URL%/}/api/resultados" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP $code"
          cat respuesta.json || true
          echo
          test "$code" = "200"
